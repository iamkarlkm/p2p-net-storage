enabled: false
xorKeyLength: 4096
keyDir: ""
client:
  user: ""
  userId: ""
  privateKey: ""
  serverPublicKey: ""
server:
  privateKey: ""
  clientPublicKeyTemplate: "client-public-keys/{userIdPrefix2}/{userId}.pub"
  clientPublicKeys: {}
  roles:
    core_compat:
      allowCommands:
        - ECHO
      allowCategories:
        - RPC
    dsdb_admin:
      allowCategories:
        - DS_DB
  defaultRoles:
    - core_compat
  roleBindings:
    - match: "admin-*"
      roles:
        - dsdb_admin
